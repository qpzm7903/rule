# 精简配置 - 适合节点不区分地区的场景

# 节点信息（替换成你自己的6个节点）
proxies:
  - {name: 节点1, server: 节点ip或域名, port: 端口, type: ss, cipher: aes-256-gcm, password: 密码}


# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
  fake-ip-filter:
    - "rule-set:fakeipfilter"

# 代理组（精简为3个）
proxy-groups:
  # 手动选择或自动：默认走自动，可随时切到手动
  - name: 🚀 代理
    type: select
    proxies: [♻️ 自动选择, 节点1, 节点2, 节点3, 节点4, 节点5, 节点6]

  # 自动选择延迟最低的节点
  - name: ♻️ 自动选择
    type: url-test
    proxies: [节点1, 节点2, 节点3, 节点4, 节点5, 节点6]
    tolerance: 20
    interval: 300

  # 漏网之鱼（未匹配规则的流量）
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 代理, DIRECT]

rules:
  # ============================================
  # 第一层：特殊处理（REJECT / 关键基础设施）
  # ============================================
  # 【云元数据服务】WSL2/本地环境不可达，直接拒绝避免无意义的连接尝试
  - IP-CIDR,169.254.169.254/32,REJECT,no-resolve
  # windows 的天气等小组件使用的 cdn, 同样因为无法连接导致日志刷屏, 故禁用
  - DOMAIN,t-ring-fdv2.msedge.net,REJECT,no-resolve

  # 【DNS 服务器】确保 DNS 请求正确路由
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve       # 阿里 DNS
  - IP-CIDR,223.6.6.6/32,DIRECT,no-resolve       # 阿里 DNS 备用

  # ============================================
  # 第二层：自定义规则（优先级最高）
  # ============================================
  - RULE-SET,custom_proxy,🚀 代理
  - RULE-SET,custom_direct,DIRECT

  # ============================================
  # 第三层：局域网与私有地址（防止回环和内网泄露）
  # ============================================
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT

  # ============================================
  # 第四层：高频DIRECT服务（减轻规则匹配负担）
  # ============================================
  - RULE-SET,speedtest_domain,DIRECT
  - RULE-SET,apple_domain,DIRECT
  - RULE-SET,apple_ip,DIRECT,no-resolve

  # ============================================
  # 第五层：特定应用代理（按使用频率从高到低排序）
  # ============================================
  - RULE-SET,ai_domain,🚀 代理
  - RULE-SET,onedrive_domain,🚀 代理
  - RULE-SET,steam_domain,🚀 代理
  - RULE-SET,github_domain,🚀 代理
  - RULE-SET,x_domain,🚀 代理
  - RULE-SET,telegram_ip,🚀 代理
  - RULE-SET,telegram_domain,🚀 代理
  - RULE-SET,sony_domain,🚀 代理
  - RULE-SET,microsoft_domain,🚀 代理

  # ============================================
  # 第六层：通用大厂代理（Google 系）
  # ============================================
  - RULE-SET,youtube_domain,🚀 代理
  - RULE-SET,google_domain,🚀 代理
  - RULE-SET,google_ip,🚀 代理,no-resolve

  # ============================================
  # 第七层：国内规则（大量DIRECT匹配）
  # ============================================
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve

  # ============================================
  # 第八层：兜底规则
  # ============================================
  # 非中国域名 - 走默认代理
  - RULE-SET,geolocation-!cn_domain,🚀 代理
  # 最终漏网之鱼 - 白名单模式，未知流量走代理（防墙）
  - MATCH,🐟 漏网之鱼

### 规则配置
RuleSet_classical_text: &RuleSet_classical_text {type: http, behavior: classical, interval: 43200, format: text}
RuleSet_domain_mrs: &RuleSet_domain_mrs {type: http, behavior: domain, interval: 43200, format: mrs}
RuleSet_domain_text: &RuleSet_domain_text {type: http, behavior: domain, interval: 43200, format: text}
RuleSet_ipcidr_mrs: &RuleSet_ipcidr_mrs {type: http, behavior: ipcidr, interval: 43200, format: mrs}

# 规则集
rule-providers:
  # 域名规则
  # 自定义规则
  custom_proxy:
    <<: *RuleSet_classical_text
    url: "https://raw.githubusercontent.com/lvbibir/clash/refs/heads/master/Ruleset/Proxy.list"
    path: ./rule-providers/custom_proxy.list
  custom_direct:
    <<: *RuleSet_classical_text
    url: "https://raw.githubusercontent.com/lvbibir/clash/refs/heads/master/Ruleset/Direct.list"
    path: ./rule-providers/custom_direct.list
  fakeipfilter:
    <<: *RuleSet_domain_text
    url: "https://raw.githubusercontent.com/juewuy/ShellCrash/refs/heads/dev/public/fake_ip_filter.list"
    path: ./rule-providers/fakeipfilter.list
  # 通用域名规则
  private_domain:
    <<: *RuleSet_domain_mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
    path: ./rule-providers/private_domain.mrs
  ai_domain:
